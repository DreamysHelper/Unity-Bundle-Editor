<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unity Bundle Editor</title>
<style>
:root{
  --bg:#1e1e1e;--side:#252526;--act:#333333;--title:#3c3c3c;--tabs:#252526;--tab:#2d2d2d;--status:#007acc;--status-empty:#68217a;
  --fg:#cccccc;--fg2:#9d9d9d;--fg3:#858585;--border:#3c3c3c;--hover:#2a2d2e;--sel:#37373d;--selfocus:#094771;--input:#3c3c3c;
  --accent:#007acc;--mod:#e2c08d;--err:#f48771;--ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
.ic{display:inline-block;width:16px;height:16px;flex:none;vertical-align:middle}
.ic svg{display:block;width:100%;height:100%}

/* title bar + menus */
#titlebar{height:30px;background:var(--title);display:flex;align-items:center;flex:none;position:relative;user-select:none}
#titlebar .logo{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#75beff}
#menubar{display:flex;height:100%}
.menu-item{padding:0 8px;display:flex;align-items:center;height:100%;cursor:default;color:var(--fg)}
.menu-item:hover,.menu-item.open{background:rgba(255,255,255,.1)}
#title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;color:var(--fg2);font-size:12px}
#dropdown{position:fixed;z-index:50;background:#252526;border:1px solid #454545;box-shadow:0 2px 8px rgba(0,0,0,.6);padding:4px 0;min-width:240px}
.dd-item{display:flex;justify-content:space-between;gap:30px;padding:4px 22px;cursor:default;white-space:nowrap}
.dd-item:hover{background:var(--selfocus);color:#fff}
.dd-item.disabled{color:#6b6b6b;pointer-events:none}
.dd-item .k{color:var(--fg3)}
.dd-sep{height:1px;background:#454545;margin:4px 0}

/* workbench */
#workbench{flex:1;display:flex;min-height:0}
#activitybar{width:48px;background:var(--act);display:flex;flex-direction:column;flex:none}
.act{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#858585;position:relative;cursor:pointer}
.act:hover{color:#fff}
.act.active{color:#fff}
.act.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#fff}
.act .ic{width:24px;height:24px}
.act .badge{position:absolute;right:7px;bottom:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center}
.act.grow{margin-top:auto}
#sidebar{width:300px;min-width:170px;background:var(--side);display:flex;flex-direction:column;flex:none;min-height:0}
.sb-title{height:35px;padding:0 20px;display:flex;align-items:center;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--fg);flex:none}
.sb-title .sp{flex:1}
.sb-title .tb{display:inline-flex;gap:2px}
.icon-btn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;cursor:pointer;color:var(--fg)}
.icon-btn:hover{background:rgba(90,93,94,.31)}
.sec{display:flex;flex-direction:column;min-height:22px;border-top:1px solid rgba(128,128,128,.35)}
.sec.first{border-top:0}
.sec-h{height:22px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;user-select:none;background:rgba(128,128,128,.08)}
.sec-h .chev{transition:none}
.sec.collapsed .chev{transform:none}
.sec:not(.collapsed) .sec-h .chev{transform:rotate(90deg)}
.sec-h .grow{flex:1}
.sec-h .tb{display:none;gap:2px}
.sec-h:hover .tb,.sec-h:focus-within .tb{display:inline-flex}
.sec-b{flex:1;min-height:0;display:flex;flex-direction:column}
.sec.collapsed .sec-b{display:none}
.sec.collapsed{flex:none!important}
.sec{flex:1 1 0}
.sash{flex:none;background:transparent;position:relative;z-index:5}
.sash.v{width:4px;margin:0 -2px;cursor:ew-resize}
.sash.h{height:4px;margin:-2px 0;cursor:ns-resize}
.sash:hover,.sash.drag{background:var(--accent)}
.sb-input{margin:4px 8px;display:flex}
.sb-input input{flex:1;background:var(--input);border:1px solid transparent;padding:3px 6px;height:24px;outline:none;min-width:0}
.sb-input input:focus{border-color:var(--accent)}
.sb-input input::placeholder{color:#8a8a8a}
.msg{padding:8px 20px;color:var(--fg2);line-height:1.5}
.btn{background:var(--accent);color:#fff;border:0;padding:6px 12px;cursor:pointer;display:block;width:100%;margin:6px 0;text-align:center}
.btn:hover{background:#0b6aa8}
.btn.sec2{background:#3a3d41}
.btn.sec2:hover{background:#45494e}
.btn.inline{display:inline-block;width:auto;margin:0 6px 0 0;padding:4px 10px}

/* virtual list rows */
.vl{position:relative;overflow:auto;flex:1;min-height:0;outline:none}
.vl-inner{position:relative;min-width:100%}
.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:3px;white-space:nowrap;cursor:pointer;padding-right:8px}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.vl:focus .row.sel{background:var(--selfocus);color:#fff}
.row .chev{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.row .chev.open svg{transform:rotate(90deg)}
.row .lab{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .meta{color:var(--fg3);font-size:11px;margin-left:6px}
.row.inactive .lab{color:#7c7c7c;font-style:italic}
.row.mod .lab{color:var(--mod)}
.row .badge-m{color:var(--mod);font-size:11px;margin-left:6px}
.row .eye{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--fg3);visibility:hidden}
.row:hover .eye,.row.inactive .eye,.row.sel .eye{visibility:visible}
.row .eye:hover{background:rgba(90,93,94,.5);color:#fff}
.row.inactive .eye{color:#c5a05c}
.c-cube{color:#75beff}.c-file{color:#c5c5c5}.c-folder{color:#c09553}.c-bundle{color:#e2c08d}.c-mono{color:#b180d7}.c-res{color:#89d185}

/* tabs and editor */
#editor-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#tabbar{height:35px;background:var(--tabs);display:flex;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none}
#tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;background:var(--tab);color:var(--fg3);border-right:1px solid var(--side);cursor:pointer;white-space:nowrap;min-width:0;user-select:none;position:relative}
.tab.active{background:var(--bg);color:#fff}
.tab.active:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent)}
.tab.preview .tl{font-style:italic}
.tab .x{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent}
.tab:hover .x,.tab.active .x{color:var(--fg)}
.tab .x:hover{background:rgba(90,93,94,.5)}
.tab.dirty .x{color:var(--fg)}
.tab.dirty:not(:hover) .x .xi{display:none}
.tab.dirty:not(:hover) .x:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg)}
#editor{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.crumb{height:22px;flex:none;display:flex;align-items:center;padding:0 14px;color:var(--fg2);font-size:12px;gap:4px}
.crumb b{font-weight:400;color:var(--fg)}

/* panel */
#panel{height:200px;min-height:60px;background:var(--bg);border-top:1px solid rgba(128,128,128,.35);display:flex;flex-direction:column;flex:none}
#panel.hidden{display:none}
.ptabs{height:35px;display:flex;align-items:center;padding:0 12px;gap:18px;flex:none}
.ptab{font-size:11px;text-transform:uppercase;color:var(--fg2);padding:4px 0;cursor:pointer;border-bottom:1px solid transparent}
.ptab.active{color:#e7e7e7;border-color:#e7e7e7}
.ptab .cnt{background:#4d4d4d;border-radius:10px;padding:0 5px;font-size:10px;margin-left:4px}
.ptabs .sp{flex:1}
.pbody{flex:1;overflow:auto;font-family:var(--mono);font-size:12px;padding:0 14px 8px;line-height:1.55;user-select:text}
.pbody .t{color:#6a9955;margin-right:8px}
.pbody .warn{color:#cca700}.pbody .error{color:var(--err)}.pbody .ok{color:#89d185}

/* status */
#statusbar{height:22px;background:var(--status);color:#fff;display:flex;align-items:center;font-size:12px;flex:none;user-select:none}
#statusbar.empty{background:var(--status-empty)}
.st{padding:0 8px;height:100%;display:flex;align-items:center;gap:5px;cursor:default;white-space:nowrap}
.st.click{cursor:pointer}.st.click:hover{background:rgba(255,255,255,.12)}
.st.sp{flex:1;padding:0}
.st.remote{background:#16825d;width:36px;justify-content:center;padding:0}
#statusbar.empty .st.remote{background:#4d1a5c}
.spin{width:11px;height:11px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#progress{position:absolute;left:0;top:0;height:2px;background:#0e70c0;width:0;transition:width .15s;z-index:3}

/* welcome */
.welcome{padding:60px 80px;overflow:auto;max-width:1000px}
.welcome h1{font-weight:300;font-size:30px;margin:0;color:#e7e7e7}
.welcome h2{font-weight:300;font-size:15px;margin:2px 0 30px;color:var(--fg2)}
.welcome h3{font-weight:400;font-size:17px;margin:24px 0 8px;color:#e7e7e7}
.welcome .cols{display:flex;gap:70px;flex-wrap:wrap}
.link{color:#3794ff;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px 0}
.link:hover{text-decoration:underline}
.kbd{font-family:var(--mono);font-size:11px;background:#3a3d41;border-radius:3px;padding:1px 6px;margin-left:8px;color:#ddd}
.welcome table{border-collapse:collapse}.welcome td{padding:3px 24px 3px 0;color:var(--fg2)}
.welcome .drop{margin-top:22px;border:1px dashed #5a5a5a;padding:14px 18px;color:var(--fg2);max-width:420px;line-height:1.5}

/* assets table */
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;flex:none;border-bottom:1px solid var(--border)}
.toolbar input[type=text],.toolbar select{background:var(--input);border:1px solid transparent;height:24px;padding:0 6px;outline:none}
.toolbar input[type=text]{width:230px}
.toolbar select{background:#3c3c3c}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar .cnt{color:var(--fg3);margin-left:auto}
.thead{display:flex;height:24px;flex:none;border-bottom:1px solid var(--border);background:var(--side);color:var(--fg2);font-size:12px;user-select:none}
.thead div,.trow .cell{padding:0 10px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.thead div{cursor:pointer}.thead div:hover{color:#fff}
.c1{width:34%}.c2{width:20%}.c3{width:8%}.c4{width:24%}.c5{width:14%;justify-content:flex-end}
.trow{display:flex;height:22px;align-items:center}
.trow .cell{font-family:var(--mono);font-size:12px}
.trow .cell.c1,.trow .cell.c2{font-family:var(--ui);font-size:13px}
.table-vl .row{padding:0}

/* inspector */
.insp{padding:14px 28px 40px;max-width:900px}
.insp-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.insp-h .ic{width:28px;height:28px}
.insp-h h1{font-size:22px;font-weight:400;margin:0;color:#e7e7e7}
.insp .sub{color:var(--fg3);margin:0 0 14px;font-size:12px}
.insp .btnrow{margin:10px 0 18px;display:flex;gap:8px;flex-wrap:wrap}
.group{margin:22px 0 4px;font-size:16px;font-weight:600;color:#e7e7e7;border-bottom:1px solid var(--border);padding-bottom:6px}
.setting{padding:12px 0 6px;display:flex;flex-direction:column;gap:3px}
.setting.mod{border-left:2px solid var(--accent);padding-left:10px;margin-left:-12px}
.setting label.n{font-weight:600;color:#e7e7e7}
.setting .d{color:var(--fg2);font-size:12px}
.setting .ctl{margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.setting input[type=number],.setting input[type=text]{background:var(--input);border:1px solid transparent;height:26px;width:104px;padding:0 6px;outline:none;font-family:var(--mono)}
.setting input[type=text]{width:260px}
.setting input:focus{border-color:var(--accent)}
.setting input[readonly]{color:var(--fg2)}
.setting .ax{color:var(--fg3);font-size:11px;width:10px;text-align:center}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.chk input{appearance:none;width:18px;height:18px;border:1px solid #6b6b6b;background:var(--input);margin:0;position:relative;cursor:pointer;border-radius:3px}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked:after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.comp{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);margin:6px 0;background:#252526}
.comp .nm{flex:1;display:flex;flex-direction:column}
.comp .nm small{color:var(--fg3);font-size:11px;font-family:var(--mono)}
.linkbtn{color:#3794ff;cursor:pointer;background:none;border:0;padding:0}
.linkbtn:hover{text-decoration:underline}
.pill{font-size:10px;background:#4d4d4d;padding:1px 6px;border-radius:9px;color:#ddd}
.pill.m{background:#6d5a2f;color:#fff}

/* hex */
.hex-vl .row{padding:0 14px;gap:0;cursor:default;font-family:var(--mono);font-size:13px}
.hx-off{width:90px;color:#858585;flex:none}
.hx{width:24px;text-align:center;flex:none;cursor:pointer}
.hx:hover{background:#3a3d41}
.hx.g{margin-right:8px}
.hx.nz{color:#9cdcfe}
.hx.chg{color:var(--mod);font-weight:700}
.hx.cur{background:var(--accent);color:#fff}
.hx.pend{background:#a66b00;color:#fff}
.hx-asc{margin-left:14px;color:#ce9178;white-space:pre;letter-spacing:.5px}
.hx-asc span.cur{background:var(--accent);color:#fff}

/* text viewer */
.code .row{cursor:text;font-family:var(--mono);font-size:13px;padding:0}
.ln{width:56px;text-align:right;padding-right:14px;color:#858585;flex:none}
.code .tx{white-space:pre;color:#d4d4d4}

/* menus */
#ctx{position:fixed;z-index:60;background:#252526;border:1px solid #454545;box-shadow:0 2px 8px rgba(0,0,0,.6);padding:4px 0;min-width:220px}
#palette{position:fixed;z-index:70;top:32px;left:50%;transform:translateX(-50%);width:600px;max-width:96vw;background:#252526;border:1px solid #454545;box-shadow:0 0 8px 2px rgba(0,0,0,.5)}
#palette input{width:calc(100% - 10px);margin:5px;background:var(--input);border:1px solid var(--accent);height:26px;padding:0 6px;outline:none}
#pal-list{max-height:320px;overflow:auto;padding-bottom:4px}
.pal-i{padding:3px 12px;display:flex;justify-content:space-between;cursor:pointer;height:22px;align-items:center}
.pal-i.sel{background:var(--selfocus);color:#fff}
.pal-i .k{color:var(--fg3);font-size:12px}
.hidden{display:none!important}
#toast{position:fixed;right:16px;bottom:34px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#252526;border:1px solid #454545;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.6);max-width:380px;border-left:3px solid var(--accent)}
.toast.error{border-left-color:var(--err)}
#dropmask{position:fixed;inset:0;background:rgba(0,122,204,.18);border:2px dashed var(--accent);z-index:90;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;pointer-events:none}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}
::-webkit-scrollbar-thumb:hover{background:rgba(100,100,100,.7)}
::-webkit-scrollbar-corner{background:transparent}
::selection{background:#264f78}

</style>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 1.5l5.5 3v7L8 14.5l-5.5-3v-7z"/><path d="M8 8v6.5M2.5 4.5L8 8l5.5-3.5"/></svg></div>
    <nav id="menubar"></nav>
    <div id="title">Unity Bundle Editor</div>
  </header>
  <div id="workbench">
    <aside id="activitybar"></aside>
    <aside id="sidebar"></aside>
    <div class="sash v" id="sash-side"></div>
    <section id="editor-area">
      <div id="tabbar"></div>
      <div id="editor"><div id="progress"></div></div>
      <div class="sash h" id="sash-panel"></div>
      <div id="panel"></div>
    </section>
  </div>
  <footer id="statusbar" class="empty"></footer>
</div>
<input type="file" id="in-dir" hidden webkitdirectory multiple>
<input type="file" id="in-file" hidden accept=".obb,.zip,.unity3d,.bundle,.assets,.apk,*/*">
<input type="file" id="in-apk" hidden accept=".apk,application/vnd.android.package-archive">
<input type="file" id="in-lib" hidden accept=".so,application/octet-stream,*/*" multiple>
<div id="palette" class="hidden"><input type="text" placeholder="Type the name of a command to run" spellcheck="false"><div id="pal-list"></div></div>
<div id="toast"></div>
<script>
/* core.js - UnityFS bundles, serialized files, LZ4/LZMA, zip/OBB. No DOM. */
'use strict';
const TD = new TextDecoder('utf-8'), TE = new TextEncoder();
const tick = () => new Promise(r => setTimeout(r, 0));

/* ---------------------------------------------------------------- reader */
class Reader {
  constructor(u8, pos = 0, le = false) {
    this.b = u8; this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    this.pos = pos; this.le = le;
  }
  get rem() { return this.b.length - this.pos; }
  u8() { return this.b[this.pos++]; }
  i16() { const v = this.dv.getInt16(this.pos, this.le); this.pos += 2; return v; }
  u16() { const v = this.dv.getUint16(this.pos, this.le); this.pos += 2; return v; }
  i32() { const v = this.dv.getInt32(this.pos, this.le); this.pos += 4; return v; }
  u32() { const v = this.dv.getUint32(this.pos, this.le); this.pos += 4; return v; }
  f32() { const v = this.dv.getFloat32(this.pos, this.le); this.pos += 4; return v; }
  i64() { const v = this.dv.getBigInt64(this.pos, this.le); this.pos += 8; return Number(v); }
  i64b() { const v = this.dv.getBigInt64(this.pos, this.le); this.pos += 8; return v; }
  cstr() {
    const s = this.pos;
    while (this.b[this.pos] !== 0) { if (this.pos >= this.b.length) throw new Error('Unterminated string'); this.pos++; }
    const r = TD.decode(this.b.subarray(s, this.pos)); this.pos++; return r;
  }
  str32() {
    const n = this.i32();
    if (n < 0 || n > this.rem) throw new Error('Bad string length');
    const s = TD.decode(this.b.subarray(this.pos, this.pos + n)); this.pos += n; return s;
  }
  align(n) { const m = this.pos % n; if (m) this.pos += n - m; }
  bytes(n) { const r = this.b.subarray(this.pos, this.pos + n); this.pos += n; return r; }
}

/* Big-endian writer for bundle headers */
class Writer {
  constructor() { this.chunks = []; this.len = 0; }
  push(u8) { this.chunks.push(u8); this.len += u8.length; }
  u8(v) { this.push(Uint8Array.of(v & 255)); }
  u16(v) { this.push(Uint8Array.of((v >>> 8) & 255, v & 255)); }
  u32(v) { this.push(Uint8Array.of((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255)); }
  i64(v) { const b = new Uint8Array(8); new DataView(b.buffer).setBigInt64(0, BigInt(v), false); this.push(b); }
  cstr(s) { this.push(TE.encode(s)); this.u8(0); }
  bytes(u8) { this.push(u8); }
  align(n) { const m = this.len % n; if (m) this.push(new Uint8Array(n - m)); }
  done() { const o = new Uint8Array(this.len); let p = 0; for (const c of this.chunks) { o.set(c, p); p += c.length; } return o; }
}

/* ------------------------------------------------------------------- LZ4 */
function lz4Decompress(src, dstSize) {
  const dst = new Uint8Array(dstSize); let s = 0, d = 0; const sl = src.length;
  while (s < sl) {
    const tok = src[s++]; let lit = tok >> 4;
    if (lit === 15) { let b; do { b = src[s++]; lit += b; } while (b === 255); }
    if (lit) { dst.set(src.subarray(s, s + lit), d); s += lit; d += lit; }

const PRO_KEY = 'Dreamy1471';
const PRO_STORAGE = 'ube_pro_unlocked_v1';
const ANTI_KEYWORDS = [
  'coke cola', 'coke', 'cola', 'dll', 'lemon', 'antidll', 'antilemon', 'anti-dll', 'anti_dll',
  'playfablogin', 'playfabmanager', 'playfab', 'questlink', 'oculuslink', 'metalink',
  'entitlementcheck', 'entitlement', 'anticheat', 'anti_cheat', 'anti-cheat', 'cheatdetect',
  'integritycheck', 'safetynet', 'playintegrity', 'appattest', 'licensecheck', 'drmcheck',
  'il2cppdumper', 'emulatorcheck', 'rootcheck', 'rootdetect', 'magisk', 'xposed',
  'authguard', 'sessioncheck', 'bancheck', 'hwid', 'deviceban', 'obfuscat'
];

function loadProState() {
  try { S.proUnlocked = localStorage.getItem(PRO_STORAGE) === '1'; } catch (e) { S.proUnlocked = false; }
}
function saveProState() {
  try { localStorage.setItem(PRO_STORAGE, S.proUnlocked ? '1' : '0'); } catch (e) { /* ignore */ }
}
function promptProKey() {
  const k = window.prompt('Enter Pro key to unlock Remove Anti Cheats:');
  if (k === null) return false;
  if (k.trim() === PRO_KEY) {
    S.proUnlocked = true;
    saveProState();
    toast('Pro unlocked. Key saved on this device.');
    log('Pro unlocked', 'ok');
    return true;
  }
  toast('Invalid key', 'error');
  return false;
}
function ensurePro() {
  if (S.proUnlocked) return true;
  return promptProKey();
}

function matchesAnti(name) {
  if (!name) return null;
  const low = name.toLowerCase().replace(/\s+/g, ' ');
  for (const kw of ANTI_KEYWORDS) {
    if (low.includes(kw)) return kw;
  }
  return null;
}

async function runAntiScan() {
  if (!ensurePro()) return;
  if (!S.bundles.size) {
    toast('Open a bundle (e.g. data.unity3d) first');
    return;
  }
  busy('Scanning for checks...');
  const results = [];
  const seen = new Set();
  for (const b of S.bundles.values()) {
    for (let i = 0; i < b.nodes.length; i++) {
      const n = b.nodes[i];
      if (!(n.flags & 4) && /\.(resS|resource|ress)$/i.test(n.path)) continue;
      const sf = getSF(b, i);
      if (!sf) continue;
      for (const o of sf.objects) {
        let hitName = '', hitKw = null, kind = '';
        if (o.classID === 1) {
          const nm = objName(sf, o);
          hitKw = matchesAnti(nm);
          if (hitKw) { hitName = nm; kind = 'GameObject'; }
        } else if (o.classID === 114) {
          const own = monoOwnName(sf, o) || '';
          const scr = monoScriptName(sf, o) || '';
          hitKw = matchesAnti(own) || matchesAnti(scr);
          if (hitKw) { hitName = own || scr || className(o.classID); kind = 'MonoBehaviour / Script'; }
        } else {
          const nm = objName(sf, o);
          hitKw = matchesAnti(nm);
          if (hitKw) { hitName = nm; kind = className(o.classID); }
        }
        if (hitKw) {
          const key = sf.key + '|' + o.id;
          if (seen.has(key)) continue;
          seen.add(key);
          results.push({ sf, o, name: hitName, kind, kw: hitKw, path: sf.name });
        }
      }
      await tick();
    }
  }
  busy(null);
  S.proScanResults = results;
  log(`Anti-cheat scan: ${results.length} match(es)`, results.length ? 'warn' : 'ok');
  toast(results.length ? `Found ${results.length} potential check(s)` : 'No matching checks found');
  renderSidebar();
}

/** Fully neutralize a hit: disable GO (and its enabled components) or disable component; then wipe object payload so the check is deleted in practice. */
function removeAntiHit(hit) {
  if (!ensurePro()) return;
  const { sf, o } = hit;
  const b = sf.bundle;
  withGroup(`Remove anti-check "${hit.name || o.id}"`, () => {
    if (o.classID === 1) {
      const sc = sceneOf(sf);
      const n = sc.goNodes.get(o.id);
      if (n && n.go) {
        setActive(sf, n, false);
        for (const c of n.go.comps) {
          if (c.file !== 0) continue;
          const co = sf.objMap.get(c.id);
          if (co) {
            const e = readEnabled(sf, co);
            if (e && e.value) setCompEnabled(sf, co, false);
          }
        }
      }
    } else {
      const e = readEnabled(sf, o);
      if (e) setCompEnabled(sf, o, false);
    }
    // Wipe object bytes (same size) so the check data is deleted from the bundle
    if (o.byteSize > 0) {
      const zeros = new Uint8Array(o.byteSize);
      patch(b, sf.base + o.byteStart, zeros, `Delete payload of ${hit.name || o.id}`);
      invalidate(b);
    }
  });
  toast(`Removed "${hit.name || o.id}"`);
  S.proScanResults = S.proScanResults.filter(x => !(x.sf === sf && x.o.id === o.id));
  refresh();
}

function removeAllAntiHits() {
  if (!ensurePro()) return;
  if (!S.proScanResults.length) { toast('Run scan first'); return; }
  const list = S.proScanResults.slice();
  withGroup('Remove all scanned anti-cheat checks', () => {
    let c = 0;
    for (const hit of list) {
      const { sf, o } = hit;
      const b = sf.bundle;
      if (o.classID === 1) {
        const sc = sceneOf(sf);
        const n = sc.goNodes.get(o.id);
        if (n && n.go) {
          setActive(sf, n, false);
          for (const comp of n.go.comps) {
            if (comp.file !== 0) continue;
            const co = sf.objMap.get(comp.id);
            if (co) {
              const e = readEnabled(sf, co);
              if (e && e.value) setCompEnabled(sf, co, false);
            }
          }
        }
      } else {
        const e = readEnabled(sf, o);
        if (e) setCompEnabled(sf, o, false);
      }
      if (o.byteSize > 0) {
        const zeros = new Uint8Array(o.byteSize);
        patch(b, sf.base + o.byteStart, zeros, `Delete payload of ${hit.name || o.id}`);
        invalidate(b);
      }
      c++;
    }
    log(`Removed ${c} anti-cheat object(s)`);
    toast(`Removed ${c} object(s)`);
  });
  S.proScanResults = [];
  refresh();
}

function buildAssets(t) {

    if (q) items = items.filter(o => o.id === q || className(o.classID).toLowerCase().includes(q) || objName(sf, o).toLowerCase().includes(q));
    const s = t.sort;

      items = items.slice().sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * s.dir; });

function download(blob, name) {

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600000);

function hasPendingOutputChanges() {

async function save() {
  const mods = dirtyBundles();
  if (!S.src) { toast('Nothing is open'); return; }
  if (!hasPendingOutputChanges()) { toast('No changes to save'); return; }
  try {
    const repl = new Map();
    for (const b of mods) {
      busy('Repacking ' + base(b.path), 0);
      const blob = b.kind === 'raw' ? new Blob([b.data]) : await writeBundle(b, f => busy('Repacking ' + base(b.path), f));
      repl.set(b.path, blob); log(`Repacked ${b.path}: ${fmt(blob.size)} bytes`);
    }
    // Smali text replacements
    for (const [path, text] of S.smaliDirty) {
      const blob = new Blob([TE.encode(text)]);
      repl.set(path, blob);
      log(`Patched smali ${path}`);
    }
    let out, name;
    if (S.src.kind === 'file') { out = repl.get(S.src.entries[0].path); name = S.src.outName; }
    else {
      const entries = [], t = dosNow(); let i = 0;
      const skipSig = S.src.kind === 'apk'; // strip old signatures so APK can be resigned

        if (skipSig && /^META-INF\//i.test(en.path) && /\.(SF|RSA|DSA|EC)$/i.test(en.path)) continue;
        if (skipSig && /^META-INF\/MANIFEST\.MF$/i.test(en.path)) continue;
        // skip old copies of libs we are replacing
        if (S.libs.some(l => en.path === `lib/arm64-v8a/${l.fileName}` || en.path === `lib/armeabi-v7a/${l.fileName}` || en.path === `lib/armeabi/${l.fileName}`)) continue;

        else if (en.zip) entries.push({ name: en.path, method: en.zip.method, time: en.zip.time, date: en.zip.date, crc: en.zip.crc, csize: en.zip.csize, usize: en.zip.usize, data: await zipRaw(S.src.zipFile, en.zip) });
        else entries.push({ name: en.path, method: 0, ...t, crc: await crc32Blob(en.blob), csize: en.blob.size, usize: en.blob.size, data: en.blob });
      }

      for (const lib of S.libs) {
        for (const abi of ['arm64-v8a', 'armeabi-v7a']) {
          const path = `lib/${abi}/${lib.fileName}`;
          busy('Adding ' + path);
          const data = lib.blob;
          const size = data.size != null ? data.size : (await data.arrayBuffer()).byteLength;
          const blob = data instanceof Blob ? data : new Blob([data]);
          entries.push({ name: path, method: 0, ...t, crc: await crc32Blob(blob), csize: blob.size, usize: blob.size, data: blob });

        }

  View: [{ label: 'Command Palette...', key: 'Ctrl+Shift+P', run: openPalette }, '-', { label: 'Explorer', key: 'Ctrl+Shift+E', run: () => setView('explorer') }, { label: 'Search', key: 'Ctrl+Shift+F', run: () => setView('search') }, { label: 'Changes', key: 'Ctrl+Shift+G', run: () => setView('changes') }, '-',
    { label: 'Toggle Sidebar', key: 'Ctrl+B', run: toggleSidebar }, { label: 'Toggle Panel', key: 'Ctrl+J', run: togglePanel }],
  Help: [{ label: 'Keyboard Shortcuts', run: showKeys }, { label: 'About', run: () => toast('Unity Bundle Editor - edits UnityFS bundles (data.unity3d) and repacks the OBB in your browser. Nothing is uploaded.') }],
});
function renderMenubar() {
  const mb = $('#menubar'); mb.replaceChildren();
  for (const name of Object.keys(MENUS())) {
    const el = h('div', { class: 'menu-item', onclick: e => { e.stopPropagation(); const r = el.getBoundingClientRect(); const open = el.classList.contains('open'); hideCtx(); if (!open) { showCtx(r.left, r.bottom, MENUS()[name]); el.classList.add('open'); } },
      onmouseenter: () => { if (document.querySelector('.menu-item.open') && !el.classList.contains('open')) { const r = el.getBoundingClientRect(); hideCtx(); showCtx(r.left, r.bottom, MENUS()[name]); el.classList.add('open'); } } }, name);
    mb.append(el);
  }
}
function showKeys() {
  log('Shortcuts: Ctrl+O open folder | Ctrl+S save | Ctrl+Z undo | Ctrl+Y redo | Ctrl+Shift+P commands | Ctrl+B sidebar | Ctrl+J panel | Space toggles SetActive in hierarchy | Enter inspects');
  S.panel = 'output'; $('#panel').classList.remove('hidden'); renderPanel();
}
function focusFilter() { const f = $('#tbl-filter') || UI.hierFilter; if (f) { f.focus(); f.select(); } }
const COMMANDS = () => [
  { label: 'File: Open Folder...', key: 'Ctrl+O', run: pickFolder }, { label: 'File: Open File...', run: pickFile }, { label: 'File: Open APK File (Load Libs)...', run: pickApk }, { label: 'Pro: Choose .so Library', run: pickLib }, { label: 'File: Save and Download', key: 'Ctrl+S', run: save },
  { label: 'Edit: Undo', key: 'Ctrl+Z', run: undo }, { label: 'Edit: Redo', key: 'Ctrl+Y', run: redo }, { label: 'Edit: Discard All Changes', run: discardAll },
  { label: 'Unity: Enable All GameObjects in Active File', run: () => S.activeSF && setAllActive(S.activeSF, true) }, { label: 'Unity: Disable All GameObjects in Active File', run: () => S.activeSF && setAllActive(S.activeSF, false) },
  { label: 'Unity: Enable All Components (m_Enabled) in Active File', run: () => S.activeSF && setAllEnabled(S.activeSF, true) }, { label: 'Unity: Disable All Components (m_Enabled) in Active File', run: () => S.activeSF && setAllEnabled(S.activeSF, false) },
  { label: 'Unity: Show Only Inactive GameObjects', run: () => { S.hierInactive = !S.hierInactive; setView('explorer'); } },
  { label: 'View: Show Explorer', run: () => setView('explorer') }, { label: 'View: Show Search', run: () => setView('search') }, { label: 'View: Show Changes', run: () => setView('changes') },
  { label: 'View: Show Pro (Remove Anti Cheats)', run: () => setView('pro') },
  { label: 'Pro: Scan For Checks', run: runAntiScan },
  { label: 'View: Toggle Panel', key: 'Ctrl+J', run: togglePanel }, { label: 'View: Toggle Sidebar', key: 'Ctrl+B', run: toggleSidebar }, { label: 'Help: Keyboard Shortcuts', run: showKeys },
];
function openPalette() {
  const p = $('#palette'); p.classList.remove('hidden'); const inp = $('input', p); inp.value = ''; inp.focus(); let sel = 0, list = [];
  const draw = () => { const q = inp.value.toLowerCase(); list = COMMANDS().filter(c => c.label.toLowerCase().includes(q)).slice(0, 14); sel = Math.min(sel, Math.max(0, list.length - 1));
    $('#pal-list').replaceChildren(...list.map((c, i) => h('div', { class: 'pal-i' + (i === sel ? ' sel' : ''), onclick: () => run(c), onmouseenter: () => { sel = i; draw2(); } }, h('span', {}, c.label), h('span', { class: 'k' }, c.key || '')))); };
  const draw2 = () => [...$('#pal-list').children].forEach((e, i) => e.classList.toggle('sel', i === sel));
  const run = c => { close(); c.run(); }, close = () => { p.classList.add('hidden'); inp.onkeydown = inp.oninput = inp.onblur = null; };
  inp.oninput = () => { sel = 0; draw(); };
  inp.onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(list.length - 1, sel + 1); draw2(); e.preventDefault(); } else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw2(); e.preventDefault(); } else if (e.key === 'Enter') { if (list[sel]) run(list[sel]); } else if (e.key === 'Escape') close(); };
  inp.onblur = () => setTimeout(close, 150); draw();
}

/* --------------------------------------------------------------- init */
function initSash(id, dir) {
  const s = $(id); s.addEventListener('mousedown', e => {
    e.preventDefault(); s.classList.add('drag'); const sb = $('#sidebar'), pn = $('#panel'), x0 = e.clientX, y0 = e.clientY, w0 = sb.offsetWidth, h0 = pn.offsetHeight;
    const mv = ev => { if (dir === 'v') sb.style.width = Math.max(170, Math.min(innerWidth * 0.6, w0 + ev.clientX - x0)) + 'px'; else pn.style.height = Math.max(60, Math.min(innerHeight * 0.8, h0 - (ev.clientY - y0))) + 'px'; };
    const up = () => { s.classList.remove('drag'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
}
function init() {
  loadProState();
  renderMenubar(); initSash('#sash-side', 'v'); initSash('#sash-panel', 'h');
  $('#in-dir').addEventListener('change', e => loadFolderFiles(e.target.files));
  $('#in-file').addEventListener('change', e => e.target.files[0] && loadSingleFile(e.target.files[0]));
  $('#in-apk').addEventListener('change', e => e.target.files[0] && loadSingleFile(e.target.files[0]));
  $('#in-lib').addEventListener('change', e => e.target.files.length && loadLibFiles(e.target.files));
  document.addEventListener('click', e => { if (!e.target.closest('#ctx') && !e.target.closest('.menu-item')) hideCtx(); });
  document.addEventListener('contextmenu', e => { if (!e.target.closest('.row, .tab, .menu-item, input')) { /* keep default off for app surface */ } });
  document.addEventListener('keydown', e => {
    const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), tgt = e.target;
    const typing = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'SELECT');
    if (c && k === 's') { e.preventDefault(); save(); }
    else if (c && e.shiftKey && k === 'p' || k === 'f1') { e.preventDefault(); openPalette(); }
    else if (c && k === 'o') { e.preventDefault(); e.shiftKey ? pickFile() : pickFolder(); }
    else if (c && k === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (c && k === 'y' && !typing) { e.preventDefault(); redo(); }
    else if (c && k === 'b') { e.preventDefault(); toggleSidebar(); }
    else if (c && k === 'j') { e.preventDefault(); togglePanel(); }
    else if (c && k === 'w') { e.preventDefault(); S.active && closeTab(S.active); }
    else if (c && k === 'f' && !e.shiftKey) { e.preventDefault(); focusFilter(); }
    else if (c && e.shiftKey && k === 'e') { e.preventDefault(); setView('explorer'); }
    else if (c && e.shiftKey && k === 'f') { e.preventDefault(); setView('search'); }
    else if (c && e.shiftKey && k === 'g') { e.preventDefault(); setView('changes'); }
    else if (k === 'escape') hideCtx();
  });
  let dragN = 0;
  addEventListener('dragenter', e => { e.preventDefault(); if (++dragN === 1) document.body.append(h('div', { id: 'dropmask' }, 'Drop folder, .obb or data.unity3d')); });
  addEventListener('dragleave', e => { if (--dragN <= 0) { dragN = 0; const m = $('#dropmask'); m && m.remove(); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dragN = 0; const m = $('#dropmask'); m && m.remove(); handleDrop(e.dataTransfer); });
  addEventListener('beforeunload', e => { if (dirtyBundles().length) { e.preventDefault(); e.returnValue = ''; } });
  log('Unity Bundle Editor ready. Open a folder, .obb or data.unity3d.');
  openTab({ key: 'welcome', kind: 'welcome', title: 'Welcome', icon: 'file' });
  renderAll();
}
init();
})();

</script>
